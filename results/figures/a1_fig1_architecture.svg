<svg viewBox="0 0 700 710" xmlns="http://www.w3.org/2000/svg" font-family="Seravek, 'Avenir Next', 'Gill Sans', sans-serif" role="img" aria-labelledby="f1t">
  <title id="f1t">System architecture: request, model, projections, monitor, judge</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16202c"></path></marker></defs>
  <g font-size="22" fill="#16202c">
    <circle cx="20" cy="48" r="18" fill="#16202c"></circle><text x="20" y="55" fill="#fff" text-anchor="middle" font-size="20" font-weight="600">1</text>
    <rect x="48" y="4" width="648" height="92" rx="12" fill="#fff" stroke="#16202c" stroke-width="2.2"></rect>
    <text x="66" y="38" font-weight="600" font-size="24">Request (JailbreakBench, HarmBench)</text>
    <text x="66" y="74" fill="#4d5868">plain, wrapped or published jailbreak; benign controls</text>
    <line x1="372" y1="98" x2="372" y2="120" stroke="#16202c" stroke-width="2.2" marker-end="url(#ah)"></line>

    <circle cx="20" cy="170" r="18" fill="#16202c"></circle><text x="20" y="177" fill="#fff" text-anchor="middle" font-size="20" font-weight="600">2</text>
    <rect x="48" y="126" width="648" height="92" rx="12" fill="#fff" stroke="#16202c" stroke-width="2.2"></rect>
    <text x="66" y="160" font-weight="600" font-size="24">LLM reads it and answers</text>
    <text x="66" y="196" fill="#4d5868">Qwen2.5-Omni-7B or Mistral-7B; activations, tokens 0–20</text>
    <line x1="372" y1="220" x2="372" y2="242" stroke="#16202c" stroke-width="2.2" marker-end="url(#ah)"></line>

    <circle cx="20" cy="292" r="18" fill="#16202c"></circle><text x="20" y="299" fill="#fff" text-anchor="middle" font-size="20" font-weight="600">3</text>
    <rect x="48" y="248" width="648" height="196" rx="12" fill="#fff" stroke="#16202c" stroke-width="2.2"></rect>
    <text x="66" y="282" font-weight="600" font-size="24">Project onto fixed directions</text>
    <rect x="66" y="300" width="196" height="64" rx="8" fill="#fde9df"></rect><rect x="66" y="300" width="8" height="64" fill="#f47230"></rect>
    <text x="84" y="327" font-size="21">5 emotion</text><text x="84" y="353" font-size="21">vectors [1]</text>
    <rect x="274" y="300" width="196" height="64" rx="8" fill="#d9f4ee"></rect><rect x="274" y="300" width="8" height="64" fill="#00b894"></rect>
    <text x="292" y="327" font-size="21">refusal</text><text x="292" y="353" font-size="21">direction [2]</text>
    <rect x="482" y="300" width="196" height="64" rx="8" fill="#efefef"></rect><rect x="482" y="300" width="8" height="64" fill="#9a9a9a"></rect>
    <text x="500" y="327" font-size="21">200 random</text><text x="500" y="353" font-size="21">directions</text>
    <text x="66" y="394" fill="#4d5868" font-size="21">emotion vectors: model-written stories, emotion never named</text>
    <text x="66" y="424" fill="#4d5868" font-size="21">baseline without activations: text of the first k tokens</text>
    <line x1="372" y1="446" x2="372" y2="468" stroke="#16202c" stroke-width="2.2" marker-end="url(#ah)"></line>

    <circle cx="20" cy="518" r="18" fill="#16202c"></circle><text x="20" y="525" fill="#fff" text-anchor="middle" font-size="20" font-weight="600">4</text>
    <rect x="48" y="474" width="648" height="92" rx="12" fill="#fff" stroke="#16202c" stroke-width="3.2"></rect>
    <text x="66" y="508" font-weight="600" font-size="24">Logistic monitor → P(model will comply)</text>
    <text x="66" y="544" fill="#4d5868">alarm above a threshold → human review</text>

    <circle cx="20" cy="660" r="18" fill="#16202c"></circle><text x="20" y="667" fill="#fff" text-anchor="middle" font-size="20" font-weight="600">5</text>
    <rect x="48" y="616" width="648" height="90" rx="12" fill="#fff" stroke="#16202c" stroke-width="2.2" stroke-dasharray="9 6"></rect>
    <text x="66" y="650" font-weight="600" font-size="24">HarmBench judge [8] labels every answer</text>
    <text x="66" y="686" fill="#4d5868">complied / refused: the target the monitor must predict</text>
    <line x1="372" y1="614" x2="372" y2="574" stroke="#16202c" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ah)"></line>
  </g>
</svg>